name: Deploy AI Agent Server

'on':
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SERVER_HOST: 120.48.86.101
  SERVER_USER: root
  NODE_VERSION: '24.9.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        working-directory: apps/ai-agent-server
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/ai-agent-server
        run: pnpm run build

      - name: Install DeepSeek Harness
        run: |
          mkdir -p /tmp/harness
          cd /tmp/harness
          npm init -y
          npm install @deepseek-ai/dsh
          # Resolve actual dsh entry point
          DSH_BIN=$(readlink -f node_modules/.bin/dsh)
          echo "DSH actual binary: $DSH_BIN"
          echo "DSH bin resolved"
          # Copy the full harness installation
          cp -r node_modules /tmp/harness-deps

      - name: Package
        run: |
          mkdir -p /tmp/package
          cp -r apps/ai-agent-server/dist /tmp/package/
          cp apps/ai-agent-server/package.json /tmp/package/
          cp apps/ai-agent-server/ecosystem.config.cjs /tmp/package/
          cp apps/ai-agent-server/.env.example /tmp/package/
          # Bundle Harness
          cp -r /tmp/harness-deps /tmp/package/harness
          cd /tmp/package
          tar czf /tmp/ai-agent-server.tar.gz .
          echo "Artifact size: $(du -h /tmp/ai-agent-server.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/ai-agent-server.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          API_KEY: ${{ secrets.API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/ai-agent-server.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:/opt/ai-agent-server/"

          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" << 'REMOTE_SCRIPT'
          set -e
          cd /opt/ai-agent-server
          tar xzf ai-agent-server.tar.gz
          rm -f ai-agent-server.tar.gz
          mkdir -p uploads processed thumbnails logs temp

          # Setup Harness CLI
          if [ -d "harness" ]; then
            ln -sf /opt/ai-agent-server/harness/.bin/dsh /usr/local/bin/dsh 2>/dev/null
            ln -sf /opt/ai-agent-server/harness/.bin/dsh /opt/ai-agent-server/.bin-dsh 2>/dev/null
            if [ -f /usr/local/bin/dsh ]; then
              echo "Harness CLI ready"
              /usr/local/bin/dsh --version 2>&1 || echo "dsh version check failed (ok, fallback available)"
            fi
          else
            echo "Harness not bundled"
          fi

          # Env
          LLM_API_URL="${LLM_API_URL}"
          [ -z "$LLM_API_URL" ] && LLM_API_URL="https://token.sensenova.cn/v1"
          LLM_MODEL="${LLM_MODEL}"
          [ -z "$LLM_MODEL" ] && LLM_MODEL="sensenova-6.8-flash-lite"
          API_KEY="${API_KEY}"
          [ -z "$API_KEY" ] && API_KEY="muyaya-secret-key-2026"
          LLM_API_KEY="${LLM_API_KEY}"
          # PhotoCraft serve gateway token 复用服务器现有文件（tar 解包不覆盖它）
          PHOTOCRAFT_SERVE_TOKEN="$(cat /opt/ai-agent-server/photocraft-serve.token 2>/dev/null || echo '')"

          printf '%s\n' \
            "PORT=3000" \
            "NODE_ENV=production" \
            "API_KEY=$API_KEY" \
            "LLM_API_URL=$LLM_API_URL" \
            "LLM_API_KEY=$LLM_API_KEY" \
            "LLM_MODEL=$LLM_MODEL" \
            "UPLOAD_DIR=/opt/ai-agent-server/uploads" \
            "PROCESSED_DIR=/opt/ai-agent-server/processed" \
            "THUMBNAIL_DIR=/opt/ai-agent-server/thumbnails" \
            "LOG_DIR=/opt/ai-agent-server/logs" \
            "TEMP_DIR=/opt/ai-agent-server/temp" \
            "PHOTOCRAFT_CLI=/usr/local/bin/photocraft-cli" \
            "HARNESS_CLI=/usr/local/bin/dsh" \
            "HARNESS_ENABLED=true" \
            "PHOTOCRAFT_SERVE_PORT=7878" \
            "PHOTOCRAFT_SERVE_TOKEN=$PHOTOCRAFT_SERVE_TOKEN" \
            "PHOTOCRAFT_SERVE_ROOT=/opt/ai-agent-server" \
            "PHOTOCRAFT_SERVE_BIN=/usr/local/bin/photocraft-cli-real" \
            "DEEPSEEK_API_KEY=$LLM_API_KEY" \
            "TASK_TIMEOUT=60000" \
            > .env

          npm install --production

          pm2 delete ai-agent-server 2>/dev/null || true
          pm2 start ecosystem.config.cjs
          pm2 save

          echo "Deployed at $(date)"
          REMOTE_SCRIPT

      - name: Health check
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "sleep 5 && curl -f http://localhost:3000/api/health || exit 1"
          echo "Health check passed"
