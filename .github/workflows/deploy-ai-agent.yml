name: Deploy AI Agent Server

'on':
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SERVER_HOST: 120.48.86.101
  SERVER_USER: root
  NODE_VERSION: '24.9.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        working-directory: apps/ai-agent-server
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/ai-agent-server
        run: pnpm run build

      - name: Package
        run: |
          mkdir -p /tmp/package
          cp -r apps/ai-agent-server/dist /tmp/package/
          cp apps/ai-agent-server/package.json /tmp/package/
          cp apps/ai-agent-server/ecosystem.config.cjs /tmp/package/
          cp apps/ai-agent-server/.env.example /tmp/package/
          # dsh skills：部署时预加载到 ~/.dsh/skills，harness agent 按需加载
          # （photocraft-commands 让 agent 自己查引擎 920 个命令，避免塞满 prompt）
          cp -r apps/ai-agent-server/dsh-skills /tmp/package/
          # 不再打包上传 harness：服务器 /opt/ai-agent-server/harness 已有 dsh
          # （161MB 大包经国内服务器 scp 会半开挂死，且业务代码仅 332KB）
          cd /tmp/package
          tar czf /tmp/ai-agent-server.tar.gz .
          echo "Artifact size: $(du -h /tmp/ai-agent-server.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/ai-agent-server.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          API_KEY: ${{ secrets.API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

          # 保活参数 + 超时：国内到服务器链路易半开，不加会挂死数小时
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=30"

          sshpass -e scp $SSH_OPTS \
            /tmp/ai-agent-server.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:/opt/ai-agent-server/"

          # secret 作为远程命令的环境变量前缀传入：heredoc 用单引号避免本地误展开，
          # 否则 $LLM_API_KEY / $API_KEY 在远程为空（曾导致 .env 的 key 为空、API_KEY 落默认值）
          sshpass -e ssh $SSH_OPTS \
            "${SERVER_USER}@${SERVER_HOST}" \
            "LLM_API_URL='$LLM_API_URL' LLM_MODEL='$LLM_MODEL' API_KEY='$API_KEY' LLM_API_KEY='$LLM_API_KEY' bash -s" << 'REMOTE_SCRIPT'
          set -e
          cd /opt/ai-agent-server
          tar xzf ai-agent-server.tar.gz
          rm -f ai-agent-server.tar.gz
          mkdir -p uploads processed thumbnails logs temp

          # 预加载 dsh skills（photocraft-commands 等）
          if [ -d "dsh-skills" ]; then
            mkdir -p /root/.dsh/skills
            for d in dsh-skills/*/; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              mkdir -p "/root/.dsh/skills/$name"
              [ -f "$d/SKILL.md" ] && cp -f "$d/SKILL.md" "/root/.dsh/skills/$name/SKILL.md"
            done
            echo "dsh skills: $(ls /root/.dsh/skills 2>/dev/null | tr '\n' ' ')"
          fi

          # Setup Harness CLI：优先用全局完好 dsh，别覆盖成可能缺依赖的 harness 副本
          GLOBAL_DSH=""
          for c in /usr/local/lib/node_modules/@deepseek-ai/dsh/lib/bin.js /usr/lib/node_modules/@deepseek-ai/dsh/lib/bin.js; do
            if [ -f "$c" ] && node "$c" --version >/dev/null 2>&1; then GLOBAL_DSH="$c"; break; fi
          done
          if [ -n "$GLOBAL_DSH" ]; then
            ln -sf "$GLOBAL_DSH" /usr/local/bin/dsh
            echo "Harness CLI -> $GLOBAL_DSH"
            /usr/local/bin/dsh --version 2>&1 || echo "dsh version check failed"
          elif [ -f /opt/ai-agent-server/harness/.bin/dsh ]; then
            ln -sf /opt/ai-agent-server/harness/.bin/dsh /usr/local/bin/dsh
            echo "Harness CLI -> harness 副本"
          else
            echo "Harness not available"
          fi

          # Env
          # API_KEY 保留服务器现有值：前端 ai-widget.js 硬编码 'bubu'，
          # 被 secret/默认值覆盖会让前端直接 401
          EXISTING_API_KEY="$(grep '^API_KEY=' .env 2>/dev/null | cut -d= -f2- || echo '')"
          API_KEY="${EXISTING_API_KEY:-${API_KEY}}"
          [ -z "$API_KEY" ] && API_KEY="muyaya-secret-key-2026"
          LLM_API_URL="${LLM_API_URL}"
          [ -z "$LLM_API_URL" ] && LLM_API_URL="https://token.sensenova.cn/v1"
          LLM_MODEL="${LLM_MODEL}"
          [ -z "$LLM_MODEL" ] && LLM_MODEL="sensenova-6.8-flash-lite"
          # 同理：secret 未传时保留服务器已有 key，避免再次把 LLM_API_KEY 置空
          EXISTING_LLM_KEY="$(grep '^LLM_API_KEY=' .env 2>/dev/null | cut -d= -f2- || echo '')"
          LLM_API_KEY="${LLM_API_KEY:-$EXISTING_LLM_KEY}"
          # PhotoCraft serve gateway token 复用服务器现有文件（tar 解包不覆盖它）
          PHOTOCRAFT_SERVE_TOKEN="$(cat /opt/ai-agent-server/photocraft-serve.token 2>/dev/null || echo '')"

          printf '%s\n' \
            "PORT=3000" \
            "NODE_ENV=production" \
            "API_KEY=$API_KEY" \
            "LLM_API_URL=$LLM_API_URL" \
            "LLM_API_KEY=$LLM_API_KEY" \
            "LLM_MODEL=$LLM_MODEL" \
            "UPLOAD_DIR=/opt/ai-agent-server/uploads" \
            "PROCESSED_DIR=/opt/ai-agent-server/processed" \
            "THUMBNAIL_DIR=/opt/ai-agent-server/thumbnails" \
            "LOG_DIR=/opt/ai-agent-server/logs" \
            "TEMP_DIR=/opt/ai-agent-server/temp" \
            "PHOTOCRAFT_CLI=/usr/local/bin/photocraft-cli" \
            "HARNESS_CLI=/usr/local/bin/dsh" \
            "HARNESS_ENABLED=true" \
            "PHOTOCRAFT_SERVE_PORT=7878" \
            "PHOTOCRAFT_SERVE_TOKEN=$PHOTOCRAFT_SERVE_TOKEN" \
            "PHOTOCRAFT_SERVE_ROOT=/opt/ai-agent-server" \
            "PHOTOCRAFT_SERVE_BIN=/usr/local/bin/photocraft-cli-real" \
            "DEEPSEEK_API_KEY=$LLM_API_KEY" \
            "TASK_TIMEOUT=60000" \
            > .env

          npm install --production

          pm2 delete ai-agent-server 2>/dev/null || true
          pm2 start ecosystem.config.cjs
          pm2 save

          echo "Deployed at $(date)"
          REMOTE_SCRIPT

      - name: Health check
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "sleep 5 && curl -f http://localhost:3000/api/health || exit 1"
          echo "Health check passed"
