name: Deploy Harness CLI

'on':
  push:
    branches: [deploy-muyaya-node, ci/harness-cli, main, master]
    paths:
      # Without the workflow's own directory a commit that only adds or edits
      # this file matches no path and the run never starts.
      - '.github/workflows/**'
      # The CLI is the runtime the AI agent server shells out to, so keep it in
      # sync whenever that consumer changes. Cheap: unchanged versions are a no-op.
      - 'apps/ai-agent-server/**'
  workflow_dispatch:

# Serialize deploys: a new push replaces the in-flight run instead of letting
# two installs race for /usr/local/bin/dsh.
concurrency:
  group: deploy-harness-cli
  cancel-in-progress: true

env:
  SERVER_HOST: 120.48.86.101
  SERVER_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass ca-certificates curl

          # Ship the script as a file rather than piping it over ssh stdin:
          # sshpass takes over the local pty for password entry, which makes
          # stdin forwarding unreliable.
          cat > /tmp/deploy-harness-cli.sh <<'REMOTE'
          set -euo pipefail

          # Declared here, not in the Actions env block: the script runs on the
          # server, where workflow env vars are not present. Bump DSH_VERSION to
          # pick up a new CLI release; it is the only change the run needs.
          NODE_DIST=v24.17.0
          DSH_VERSION=0.2.1-rc.2
          NODE_DIR=/opt/harness-node
          CLI_DIR=/opt/harness-cli
          NODE_BIN="$NODE_DIR/bin/node"
          BIN="$CLI_DIR/node_modules/@deepseek-ai/dsh/lib/bin.js"

          # 1. Isolated Node 24 prefix. The published CLI's bin.js tests
          # `import.meta.main`, which only exists on Node >= 24.8, so the system
          # Node 20 can never run it. The prefix also has to stay on the same
          # major as the prebuilt @deepseek-ai/node-addon-system binaries.
          if [ ! -x "$NODE_BIN" ] || ! "$NODE_BIN" -v | grep -q '^v24\.'; then
            echo "installing Node ${NODE_DIST} into ${NODE_DIR}"
            cd /opt
            curl -fsSLO "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-linux-x64.tar.xz"
            rm -rf "$NODE_DIR"
            mkdir -p "$NODE_DIR"
            tar -xJf "node-${NODE_DIST}-linux-x64.tar.xz" -C "$NODE_DIR" --strip-components=1
            rm -f "node-${NODE_DIST}-linux-x64.tar.xz"
          fi
          "$NODE_BIN" -v

          # 2. The published CLI already ships the full runtime, so there is no
          # monorepo build and no dependency transfer: everything is fetched
          # from the registry on the server. Idempotent on the pinned version.
          INSTALLED="$(cat "$CLI_DIR/.dsh-version" 2>/dev/null || true)"
          if [ "$INSTALLED" != "$DSH_VERSION" ]; then
            echo "installing @deepseek-ai/dsh@${DSH_VERSION}"
            rm -rf "$CLI_DIR"
            mkdir -p "$CLI_DIR"
            cd "$CLI_DIR"
            npm init -y >/dev/null
            PATH="$NODE_DIR/bin:$PATH" npm install "@deepseek-ai/dsh@${DSH_VERSION}" --omit=dev --no-audit --no-fund
            echo "$DSH_VERSION" > "$CLI_DIR/.dsh-version"
            du -sh "$CLI_DIR/node_modules"
          else
            echo "@deepseek-ai/dsh@${DSH_VERSION} already installed, skipping npm install"
          fi
          test -f "$BIN"

          # 3. Launcher written as a real file. `cat >` through the pre-existing
          # symlink would write into the symlink target instead of replacing it.
          rm -f /usr/local/bin/dsh
          cat > /usr/local/bin/dsh <<'LAUNCH'
          #!/bin/sh
          # Pin the runtime explicitly: lib/bin.js carries a
          # `#!/usr/bin/env node` shebang that would otherwise resolve to the
          # system Node 20, and it never runs there (see NODE_DIST).
          exec /opt/harness-node/bin/node /opt/harness-cli/node_modules/@deepseek-ai/dsh/lib/bin.js "$@"
          LAUNCH
          chmod +x /usr/local/bin/dsh
          ls -l /usr/local/bin/dsh

          # 4. Verify: the version flag, a real subcommand, and the native
          # addon that carries the host bindings.
          dsh --version
          timeout 60 dsh --help | head -3
          ls -d "$CLI_DIR/node_modules/@deepseek-ai/node-addon-system-linux-x64"
          REMOTE

          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/deploy-harness-cli.sh \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/deploy-harness-cli.sh"

          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "bash /tmp/deploy-harness-cli.sh; rc=\$?; rm -f /tmp/deploy-harness-cli.sh; exit \$rc"

      - name: Health check
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1 || true

          for i in 1 2 3 4 5 6; do
            if sshpass -e ssh -o StrictHostKeyChecking=no \
              "${SERVER_USER}@${SERVER_HOST}" "dsh --version"; then
              echo "Harness CLI health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "FAILED: dsh --version did not pass"
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "ls -l /usr/local/bin/dsh; cat /usr/local/bin/dsh; ls /opt/harness-cli; ls /opt/harness-node/bin"
          exit 1

      - name: Verify running services
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -euo pipefail
          # Read-only on purpose. The Harness CLI is a subprocess the ai-agent
          # server spawns per request, so there is no restart to pick it up;
          # restarting here would only add an outage with no benefit.
          # Single-quoted remote commands keep the quoting flat across the
          # runner, ssh, and the remote shell.
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            'echo system node stays on Node 20; harness CLI runs on its own prefix'
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            'node -v; /opt/harness-node/bin/node -v; pm2 ls'
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            'curl -sf http://localhost:3000/api/health && echo ai-agent-server healthy'
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            'curl -sf http://localhost:3001/api/health && echo muyaya-api healthy'
