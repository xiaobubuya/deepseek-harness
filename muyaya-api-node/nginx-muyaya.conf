# Muyaya.world Nginx Configuration - HTTP only (initial)
# SSL will be added after Let's Encrypt is configured

upstream muyaya_api {
    server 127.0.0.1:3001;
}

upstream ai_agent_server {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name muyaya.world api.muyaya.world;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Photo static files
    location /photos/ {
        alias /opt/muyaya/photos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Muyaya API
    location /api/ {
        proxy_pass http://muyaya_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI Agent Server
    location /agent/ {
        proxy_pass http://ai_agent_server/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Share pages
    location /s/ {
        proxy_pass http://muyaya_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://muyaya_api/api/health;
        access_log off;
    }
}
