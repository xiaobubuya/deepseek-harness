# Controlled warning-agent composition over dsh-base.
# The profile keeps the agent kernel and workflow primitives, while disabling
# development, network, filesystem, and open-ended delegation capabilities.
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: fs-sandbox
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-ralph
  disabled: true
- id: approval
  config:
    policy: ask
- id: agent-loop
  config:
    agents: []
- id: session-persistence-jsonl
  config:
    root: !!js (process.env.WARNING_AGENT_SESSION_DIR ?? '/var/lib/warning-agent/sessions') + '/harness'
- insert:
    - id: warning-agent-runtime
      name: '@deepseek-ai/dsh-warning-agent/runtime'
      config:
        host: !!js process.env.WARNING_AGENT_HOST ?? '0.0.0.0'
        port: !!js Number(process.env.WARNING_AGENT_PORT ?? 8090)
        sharedSecret: !!js process.env.WARNING_AGENT_SHARED_SECRET ?? ''
        gatewayCallbackUrl: !!js process.env.WARNING_AGENT_GATEWAY_CALLBACK_URL ?? 'http://agent-gateway:8080/internal/agent-gateway/v1/task-events'
        callbackTimeoutMs: !!js Number(process.env.WARNING_AGENT_CALLBACK_TIMEOUT_MS ?? 3000)
        callbackRetryAttempts: !!js Number(process.env.WARNING_AGENT_CALLBACK_RETRY_ATTEMPTS ?? 3)
        callbackRetryBackoffMs: !!js Number(process.env.WARNING_AGENT_CALLBACK_RETRY_BACKOFF_MS ?? 250)
        sessionDir: !!js process.env.WARNING_AGENT_SESSION_DIR ?? '/var/lib/warning-agent/sessions'
        maxConcurrentTasks: !!js Number(process.env.WARNING_AGENT_MAX_CONCURRENT_TASKS ?? 4)
        taskTimeoutMs: !!js Number(process.env.WARNING_AGENT_TASK_TIMEOUT_MS ?? 600000)
        retentionMs: !!js Number(process.env.WARNING_AGENT_RETENTION_MS ?? 604800000)
