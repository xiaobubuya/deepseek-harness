name: Deploy AI Agent Server

'on':
  push:
    branches: [main, master]
    paths:
      - 'apps/ai-agent-server/**'
      - '.github/workflows/deploy-ai-agent.yml'
  workflow_dispatch:

env:
  SERVER_HOST: 120.48.86.101
  SERVER_USER: root
  NODE_VERSION: '24.9.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        working-directory: apps/ai-agent-server
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/ai-agent-server
        run: pnpm run build

      - name: Package
        working-directory: apps/ai-agent-server
        run: |
          mkdir -p dist-package
          cp -r dist dist-package/
          cp package.json dist-package/
          cp ecosystem.config.js dist-package/
          cp .env.example dist-package/
          cd dist-package
          tar czf ../ai-agent-server.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-server
          path: apps/ai-agent-server/ai-agent-server.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          API_KEY: ${{ secrets.API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -e

          # 安装 sshpass（密码认证）
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1

          # SCP 上传
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/ai-agent-server.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:/opt/ai-agent-server/"

          # SSH 远程部署
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" << 'REMOTE_SCRIPT'
          set -e

          cd /opt/ai-agent-server
          tar xzf ai-agent-server.tar.gz
          rm -f ai-agent-server.tar.gz

          mkdir -p uploads processed thumbnails logs temp

          # 配置环境变量（带默认值）
          LLM_API_URL="${LLM_API_URL}"
          [ -z "$LLM_API_URL" ] && LLM_API_URL="https://token.sensenova.cn/v1"
          LLM_MODEL="${LLM_MODEL}"
          [ -z "$LLM_MODEL" ] && LLM_MODEL="sensenova-6.8-flash-lite"
          API_KEY="${API_KEY}"
          [ -z "$API_KEY" ] && API_KEY="muyaya-secret-key-2026"
          LLM_API_KEY="${LLM_API_KEY}"

          printf '%s\n' \
            "PORT=3000" \
            "NODE_ENV=production" \
            "API_KEY=$API_KEY" \
            "LLM_API_URL=$LLM_API_URL" \
            "LLM_API_KEY=$LLM_API_KEY" \
            "LLM_MODEL=$LLM_MODEL" \
            "UPLOAD_DIR=/opt/ai-agent-server/uploads" \
            "PROCESSED_DIR=/opt/ai-agent-server/processed" \
            "THUMBNAIL_DIR=/opt/ai-agent-server/thumbnails" \
            "LOG_DIR=/opt/ai-agent-server/logs" \
            "TEMP_DIR=/opt/ai-agent-server/temp" \
            "PHOTOCRAFT_CLI=/usr/local/bin/photocraft-cli" \
            "TASK_TIMEOUT=60000" \
            > .env

          npm install --production

          pm2 delete ai-agent-server 2>/dev/null || true
          pm2 start ecosystem.config.js
          pm2 save

          echo "Deployed at $(date)"
          REMOTE_SCRIPT

      - name: Health check
        env:
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "sleep 5 && curl -f http://localhost:3000/api/health || exit 1"
          echo "Health check passed"
