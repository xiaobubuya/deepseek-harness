name: Deploy AI Agent Server

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/ai-agent-server/**'
      - '.github/workflows/deploy-ai-agent.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Force deploy'
        required: false
        default: true
        type: boolean

env:
  SERVER_HOST: 120.48.86.101
  SERVER_USER: root
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/ai-agent-server
        run: pnpm run build

      - name: Package
        working-directory: apps/ai-agent-server
        run: |
          mkdir -p dist-package
          cp -r dist dist-package/
          cp package.json dist-package/
          cp ecosystem.config.js dist-package/
          cp .env.example dist-package/
          cd dist-package
          tar czf ../ai-agent-server.tar.gz .

      - name: Meta
        id: meta
        run: echo "version=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-server
          path: apps/ai-agent-server/ai-agent-server.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: /tmp/ai-agent-server.tar.gz
          target: /opt/ai-agent-server/
          strip_components: 0

      - name: Setup server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            # 解压
            cd /opt/ai-agent-server
            tar xzf ai-agent-server.tar.gz
            rm -f ai-agent-server.tar.gz

            # 确保目录存在
            mkdir -p uploads processed thumbnails logs temp

            # 配置环境变量（使用 defaults 避免空值问题）
            LLM_API_URL="${{ secrets.LLM_API_URL }}"
            [ -z "$LLM_API_URL" ] && LLM_API_URL="https://token.sensenova.cn/v1"
            LLM_MODEL="${{ secrets.LLM_MODEL }}"
            [ -z "$LLM_MODEL" ] && LLM_MODEL="sensenova-6.8-flash-lite"
            API_KEY="${{ secrets.API_KEY }}"
            LLM_API_KEY="${{ secrets.LLM_API_KEY }}"
            cat > .env << ENVEOF
PORT=3000
NODE_ENV=production
API_KEY=$API_KEY
LLM_API_URL=$LLM_API_URL
LLM_API_KEY=$LLM_API_KEY
LLM_MODEL=$LLM_MODEL
UPLOAD_DIR=/opt/ai-agent-server/uploads
PROCESSED_DIR=/opt/ai-agent-server/processed
THUMBNAIL_DIR=/opt/ai-agent-server/thumbnails
LOG_DIR=/opt/ai-agent-server/logs
TEMP_DIR=/opt/ai-agent-server/temp
PHOTOCRAFT_CLI=/usr/local/bin/photocraft-cli
TASK_TIMEOUT=60000
ENVEOF

            # 安装依赖
            npm install --production

            # 重启服务
            pm2 delete ai-agent-server 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "Deployed at $(date)"

      - name: Health check
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            sleep 5
            curl -f http://localhost:3000/api/health || exit 1
            echo "Health check passed"
