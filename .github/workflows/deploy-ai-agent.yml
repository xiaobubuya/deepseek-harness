name: Deploy AI Agent Server

'on':
  push:
    branches: [deploy-muyaya-node, main, master]
  workflow_dispatch:

env:
  SERVER_HOST: 120.48.86.101
  SERVER_USER: root
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        working-directory: apps/ai-agent-server
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/ai-agent-server
        run: pnpm run build

      - name: Package
        run: |
          mkdir -p /tmp/package
          cp -r apps/ai-agent-server/dist /tmp/package/
          cp apps/ai-agent-server/package.json /tmp/package/
          cp apps/ai-agent-server/ecosystem.config.cjs /tmp/package/
          cp apps/ai-agent-server/.env.example /tmp/package/
          # Include CLI wrapper
          mkdir -p /tmp/package/cli
          cp apps/ai-agent-server/cli/photocraft-cli.mjs /tmp/package/cli/
          cd /tmp/package
          tar czf /tmp/ai-agent-server.tar.gz .
          echo "Artifact size: $(du -h /tmp/ai-agent-server.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/ai-agent-server.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-server
          path: /tmp/

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          API_KEY: ${{ secrets.API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

          # Create .env file on runner with actual values
          cat > /tmp/.env << ENVEOF
          PORT=3000
          NODE_ENV=production
          API_KEY=${API_KEY:-muyaya-secret-key-2026}
          LLM_API_URL=${LLM_API_URL:-https://token.sensenova.cn/v1}
          LLM_API_KEY=${LLM_API_KEY}
          LLM_MODEL=${LLM_MODEL:-sensenova-6.8-flash-lite}
          UPLOAD_DIR=/opt/ai-agent-server/uploads
          PROCESSED_DIR=/opt/ai-agent-server/processed
          THUMBNAIL_DIR=/opt/ai-agent-server/thumbnails
          LOG_DIR=/opt/ai-agent-server/logs
          TEMP_DIR=/opt/ai-agent-server/temp
          DEEPSEEK_API_KEY=${LLM_API_KEY}
          TASK_TIMEOUT=60000
          ENVEOF

          echo "Created .env:"
          cat /tmp/.env

          # Upload package and .env
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/ai-agent-server.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:/opt/ai-agent-server/"

          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/.env \
            "${SERVER_USER}@${SERVER_HOST}:/opt/ai-agent-server/.env"

          # Deploy on server
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "set -e
             cd /opt/ai-agent-server
             tar xzf ai-agent-server.tar.gz
             rm -f ai-agent-server.tar.gz
             mkdir -p uploads processed thumbnails logs temp
             npm install --production
             # Install PhotoCraft CLI wrapper
             if [ -f cli/photocraft-cli.mjs ]; then
               chmod +x cli/photocraft-cli.mjs
               ln -sf /opt/ai-agent-server/cli/photocraft-cli.mjs /usr/local/bin/photocraft-cli
               echo 'CLI wrapper installed'
               node /usr/local/bin/photocraft-cli --help
             fi
             pm2 delete ai-agent-server 2>/dev/null || true
             pm2 start ecosystem.config.cjs
             pm2 save
             echo 'Deployed at $(date)'"

      - name: Health check
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1

          echo "Waiting for server to start..."
          for i in 1 2 3 4 5 6; do
            if sshpass -e ssh -o StrictHostKeyChecking=no \
              "${SERVER_USER}@${SERVER_HOST}" \
              "curl -sf http://localhost:3000/api/health" 2>/dev/null; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "FAILED: Health check did not pass"
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" "pm2 list"
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" "pm2 logs ai-agent-server --lines 50 --nostream"
          exit 1
