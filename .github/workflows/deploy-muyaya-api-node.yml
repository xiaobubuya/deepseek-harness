name: Deploy Muyaya API Node

on:
  push:
    branches: [deploy-muyaya-node]
  workflow_dispatch:

env:
  SERVER_HOST: 120.48.86.101
  SERVER_USER: root
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Package Node.js app
        run: |
          mkdir -p /tmp/muyaya-node
          cp -r muyaya-api-node/src /tmp/muyaya-node/
          cp muyaya-api-node/package.json muyaya-api-node/schema.sql muyaya-api-node/ecosystem.config.cjs muyaya-api-node/nginx-muyaya.conf muyaya-api-node/.env.example /tmp/muyaya-node/
          cd /tmp/muyaya-node
          tar czf /tmp/muyaya-api-node.tar.gz .
          echo "Package size: $(du -h /tmp/muyaya-api-node.tar.gz)"

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

          # Upload package
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/muyaya-api-node.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:/opt/"

          # SSH deploy
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" 'set -e

          # --- Album API ---
          mkdir -p /opt/muyaya-api
          cd /opt/muyaya-api
          tar xzf /opt/muyaya-api-node.tar.gz
          rm -f /opt/muyaya-api-node.tar.gz

          mkdir -p /opt/muyaya/photos/thumb /opt/muyaya/photos/preview
          mkdir -p /opt/muyaya/tmp
          mkdir -p /opt/muyaya-api/logs

          echo "Installing dependencies..."
          npm install --production 2>&1

          cat > .env << ENVEOF
          PORT=3001
          PHOTO_DIR=/opt/muyaya/photos
          TMP_DIR=/opt/muyaya/tmp
          DB_PATH=/opt/muyaya/muyaya.db
          AUTH_SECRET=muyaya-secret-key-2026
          USERS={"muyaya":"muyaya2024"}
          ALLOWED_ORIGINS=https://muyaya.world,https://xiaobubuya.github.io
          AGENT_BASE_URL=http://127.0.0.1:3000
          AGENT_API_KEY=muyaya-secret-key-2026
          ENVEOF

          npm install dotenv 2>/dev/null || true

          npm install -g pm2 2>/dev/null || true
          pm2 delete muyaya-api 2>/dev/null || true
          pm2 start src/index.js --name muyaya-api
          pm2 save

          # --- Nginx ---
          echo "Setting up Nginx..."
          apt-get install -y nginx 2>&1 | tail -5

          rm -f /etc/nginx/sites-enabled/default
          rm -f /etc/nginx/conf.d/default.conf

          cp /opt/muyaya-api/nginx-muyaya.conf /etc/nginx/conf.d/muyaya.conf

          nginx -t 2>&1

          systemctl enable nginx 2>/dev/null || true
          systemctl restart nginx
          systemctl status nginx --no-pager 2>&1 | head -5

          echo "Deploy completed at $(date)"
          '

      - name: Health check
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          SERVER_USER: ${{ env.SERVER_USER }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1

          echo "Waiting for API to start..."
          for i in 1 2 3 4 5 6; do
            if sshpass -e ssh -o StrictHostKeyChecking=no \
              "${SERVER_USER}@${SERVER_HOST}" \
              "curl -sf http://localhost:3001/api/health" 2>/dev/null; then
              echo ""
              echo "API health check passed!"
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
            if [ $i -eq 6 ]; then
              echo "FAILED: API health check did not pass after 6 attempts"
              echo "--- PM2 status ---"
              sshpass -e ssh -o StrictHostKeyChecking=no \
                "${SERVER_USER}@${SERVER_HOST}" "pm2 list"
              echo "--- PM2 logs (last 50 lines) ---"
              sshpass -e ssh -o StrictHostKeyChecking=no \
                "${SERVER_USER}@${SERVER_HOST}" "pm2 logs muyaya-api --lines 50 --nostream"
              echo "--- Port check ---"
              sshpass -e ssh -o StrictHostKeyChecking=no \
                "${SERVER_USER}@${SERVER_HOST}" "ss -tlnp | grep -E '300[0-9]|:80\b'"
              exit 1
            fi
          done

          echo "All health checks passed!"